worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Use CF-Connecting-IP as real client IP
    set_real_ip_from 0.0.0.0/0;
    real_ip_header CF-Connecting-IP;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml text/x-component;

    server {
        listen 5000;
        server_name _;
        server_tokens off;

        root /app/dist;
        index index.html;
        error_page 404 /404.html;

        # Relative Location headers everywhere: the container sits behind
        # an edge proxy, so absolute redirects would leak the internal
        # port 5000 (e.g. on the trailing-slash redirect for /route).
        absolute_redirect off;

        # The exporter writes the homepage only at /; keep the /index
        # duplicate dead like the proxy-era config did.
        location = /index {
            return 308 /;
        }

        location = /404.html {
            internal;
        }

        # Hashed build assets are immutable
        location ^~ /_next/static/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Markdown companions and llms.txt render inline instead of downloading
        location ~* \.(md|txt)$ {
            default_type text/plain;
            add_header Cache-Control "public, max-age=0, s-maxage=86400, must-revalidate" always;
            try_files $uri =404;
        }

        # Search API backed by local Meilisearch (the in-page search
        # override posts here)
        location /api/search {
            proxy_pass http://127.0.0.1:7700/indexes/docs/search;
            proxy_http_version 1.1;
            proxy_set_header Content-Type application/json;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
        }

        # The exported client polls the mint dev live-update channel,
        # which doesn't exist here; keep it out of the access log.
        location /socket.io/ {
            access_log off;
            return 404;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        location / {
            # The Next router requests pages with an "RSC: 1" header and
            # expects a flight payload; serve the exported index.rsc so
            # client-side navigation works (CDN cache stays correct
            # because those requests carry a ?_rsc= cache-buster).
            if ($http_rsc = "1") {
                rewrite ^(.*?)/?$ /__rsc__$1/index.rsc last;
            }

            try_files $uri $uri/ =404;

            # Allow Cloudflare to cache, but browsers should revalidate
            add_header Cache-Control "public, max-age=0, s-maxage=86400, must-revalidate" always;
            add_header Vary "Accept-Encoding" always;
        }

        location ~ ^/__rsc__(?<rsc_path>.*)$ {
            internal;
            default_type text/x-component;
            alias /app/dist$rsc_path;
            add_header Cache-Control "public, max-age=0, s-maxage=86400, must-revalidate" always;
            add_header Vary "RSC, Accept-Encoding" always;
        }
    }
}
